[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mad-driving"
version = "0.1.0"
description = "Single-ego multi-agent speed-decision research environment for MetaDrive"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "gymnasium==1.3.0",
  "metadrive-simulator==0.4.3",
  "numpy==1.26.4",
  "pydantic==2.11.7",
  "pyyaml==6.0.2",
]

[project.optional-dependencies]
training = [
  "stable-baselines3==2.9.0",
  "tensorboard==2.19.0",
  "torch==2.8.0",
]
evaluation = [
  "imageio==2.37.0",
  "matplotlib==3.10.3",
  "pandas==2.3.1",
]

[dependency-groups]
dev = [
  "mypy==1.16.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.4",
  "types-pyyaml==6.0.12.20250516",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mad_driving"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires the real MetaDrive runtime",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mad_driving"]

[tool.coverage.run]
source = ["mad_driving"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
