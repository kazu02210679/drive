seed: 42
scenario_id: phase1_smoke
decision_steps: 100
fixed_action: [0.0, 0.25]
metadrive:
  use_render: false
  image_observation: false
  num_scenarios: 1
  start_seed: 42
  traffic_density: 0.1
  horizon: 200
  physics_dt_s: 0.02
  decision_repeat: 5
  decision_dt_s: 0.10
  lane_width_m: 3.5
scenarios:
  train:
    seed_start: 0
    seed_count: 10000
  validation:
    seed_start: 10000
    seed_count: 1000
  test:
    seed_start: 20000
    seed_count: 1000
agents:
  nominal:
    horizon_s: 5.0
    time_step_s: 0.25
    ego_length_m: 4.5
    ego_width_m: 1.8
    lane_half_width_m: 1.75
    longitudinal_buffer_m: 0.5
    lateral_buffer_m: 0.25
    probability_ttc_scale_s: 3.0
    probability_distance_scale_m: 3.0
  hazard:
    lead_max_deceleration_mps2: -8.0
    crossing_actor_max_speed_mps: 8.0
    reaction_delay_s: 0.5
    ego_max_safe_deceleration_mps2: -6.0
    ego_length_m: 4.5
    safety_buffer_m: 2.0
    occlusion_crawl_speed_mps: 2.0
    severe_margin_scale_m: 10.0
    crossing_occupancy_allowance_s: 1.0
  rule: {}
  critic:
    nominal_low_risk_threshold: 0.3
    recommendation_spread_mps: 5.0
    low_confidence_threshold: 0.5
    definitive_speed_fraction: 0.5
coordinator:
  conflict_min_action: 1
  severe_min_action: 2
  severe_threshold: 0.75
shield:
  mode: enforce
  imminent_ttc_s: 1.0
  caution_ttc_s: 3.0
  emergency_margin_m: 0.0
  caution_margin_m: 5.0
  missing_agent_action: 2
  multiple_missing_action: 3
control:
  speed:
    kp: 0.50
    ki: 0.05
    kd: 0.10
    integral_limit: 10.0
    max_acceleration_mps2: 2.5
    normal_deceleration_mps2: -3.0
    emergency_deceleration_mps2: -6.0
  steering:
    heading_kp: 1.7
    heading_ki: 0.01
    heading_kd: 3.5
    lateral_kp: 0.3
    lateral_ki: 0.002
    lateral_kd: 0.05
    integral_limit: 5.0
    lookahead_m: 1.0
observation:
  max_speed_mps: 40.0
  max_abs_acceleration_mps2: 10.0
  max_abs_lane_offset_m: 3.5
  max_ttc_s: 10.0
  max_abs_stopping_margin_m: 50.0
reward:
  progress_per_meter: 0.10
  arrival: 100.0
  collision_vehicle: 200.0
  collision_crossing_actor: 500.0
  near_miss_max: 50.0
  near_miss_ttc_s: 3.0
  offroad: 100.0
  hard_rule_violation: 100.0
  jerk_scale: 0.05
  unnecessary_brake_scale: 0.20
  unnecessary_brake_severity_threshold: 0.25
  unnecessary_brake_safe_ttc_s: 5.0
  standstill_per_second: 0.50
  standstill_speed_mps: 0.10
  shield_intervention: 2.0
training:
  algorithm: PPO
  policy: MlpPolicy
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  seed: 42
  smoke_timesteps: 5000
  total_timesteps: 500000
  num_envs: 1
  checkpoint_interval_steps: 10000
  eval_interval_steps: 10000
  eval_episodes: 5
  run_root: runs
